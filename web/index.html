<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="COM — Customer Order Management web front end over IBM i." />
    <title>COM · Order Management</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      ;(function () {
        var t = "system"
        try {
          t = localStorage.getItem("com-theme") || "system"
        } catch (e) {}
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
